# Render Blueprint: one web service (API + in-process worker) and a Postgres database.
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
databases:
  - name: mailqueue-db
    plan: free
    databaseName: mailqueue
    user: mailqueue

services:
  - type: web
    name: mail-queue-service
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mailqueue-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: WORKER_ENABLED
        value: "true"
      - key: EMAIL_FROM
        value: onboarding@resend.dev
      - key: API_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: ASNIHER_HEARTBEAT_URL
        sync: false
